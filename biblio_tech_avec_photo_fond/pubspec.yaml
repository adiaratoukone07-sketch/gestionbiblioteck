name: Biblio_tech
description: Système de Gestion de Bibliothèque Scolaire (Équipe 3)
publish_to: 'none'
version: 0.1.0

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Base de données locale (cf. cahier des charges §3.1)
  sqflite: ^2.4.2+1             # types partagés (Database, ConflictAlgorithm...) utilisés par les DAO
  sqflite_common_ffi: ^2.4.0+3  # backend SQLite desktop (Windows/Linux/macOS)
  path: ^1.9.0

  # Sécurité (cf. cahier des charges §3.1)
  bcrypt: ^1.1.3

  # Interface (cf. maquettes des vues)
  google_fonts: ^6.2.1

  # Barre de titre personnalisée (fenêtre "frameless" sur Windows)
  bitsdojo_window: ^0.1.6
  sqflite_common_ffi_web: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  # Nécessaire pour l'image de fond de login_page.dart — crée le
  # dossier et place-y ton fichier (cf. lib/views/README.md pour les
  # dimensions recommandées).
  assets:
    - assets/images/fond_bibliotech.png
    - assets/images/login_background2.png
    - assets/icons/mon_logo.png
    - assets/images/pile_livres.png

