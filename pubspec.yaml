name: bibliotheque_scolaire
description: Système de Gestion de Bibliothèque Scolaire (Équipe 3)
publish_to: 'none'
version: 0.1.0

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Base de données locale (cf. cahier des charges §3.1)
  sqflite: ^2.3.3             # types partagés (Database, ConflictAlgorithm...) utilisés par les DAO
  sqflite_common_ffi: ^2.3.3  # backend SQLite desktop (Windows/Linux/macOS)
  sqlite3_flutter_libs: ^0.5.24  # fournit sqlite3.dll pour Windows
  path: ^1.9.0

  # Sécurité (cf. cahier des charges §3.1)
  bcrypt: ^1.1.3

  # Interface (cf. maquettes des vues)
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
